<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intelligenza artificiale</title>
<style>
  /* Layout: one slide at a time, filling the window, letterboxed on the deck's ink colour. */
  :root { --bg: #121317; color-scheme: dark }
  html, body { height: 100%; margin: 0; background: var(--bg) }
  main { height: 100%; display: grid; place-items: center; cursor: pointer; user-select: none }
  main img { grid-area: 1 / 1; width: 100%; height: 100%; object-fit: contain }
  main img[hidden] { display: none }
</style>
<main>
<!--slides-->
</main>
<script>
  // ← → (and PageUp/PageDown, sent by presentation clickers) or a click on the left/right half change slide.
  const slides = [...document.querySelectorAll("main img")];
  const step = { ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1 };
  let cur = 0;
  const go = d => {
    cur = Math.min(Math.max(cur + d, 0), slides.length - 1);
    slides.forEach((img, i) => img.hidden = i !== cur);
  };
  addEventListener("keydown", e => {
    const d = step[e.key];
    if (!d || e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    go(d);
  });
  document.querySelector("main").addEventListener("click", e => go(e.clientX > innerWidth / 2 ? 1 : -1));
  go(0);
</script>
