<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intelligenza artificiale</title>
<style>
  /* Layout: one slide at a time, filling the window, letterboxed on the deck's ink colour. */
  :root { --bg: #121317; color-scheme: dark }
  html, body { height: 100%; margin: 0; background: var(--bg) }
  main { height: 100%; display: grid; place-items: center; cursor: pointer; user-select: none }
  main img { grid-area: 1 / 1; width: 100%; height: 100%; object-fit: contain; opacity: 0 }
  /* The new page fades in over the old one, which stays opaque underneath: unchanged parts of a #pause step do not flicker. */
  main img.prev { opacity: 1 }
  main img.on { opacity: 1; z-index: 1; animation: fade-in .3s ease-out }
  @keyframes fade-in { from { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { main img.on { animation: none } }
</style>
<main>
<!--slides-->
</main>
<script>
  // ← → (and PageUp/PageDown, sent by presentation clickers) or a click on the left/right half change slide.
  const slides = [...document.querySelectorAll("main img")];
  const step = { ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1 };
  let cur = 0;
  const go = d => {
    const next = Math.min(Math.max(cur + d, 0), slides.length - 1);
    if (next === cur) return;
    slides.forEach(img => img.className = "");
    slides[cur].className = "prev";
    slides[next].className = "on";
    cur = next;
  };
  addEventListener("keydown", e => {
    const d = step[e.key];
    if (!d || e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    go(d);
  });
  document.querySelector("main").addEventListener("click", e => go(e.clientX > innerWidth / 2 ? 1 : -1));
  slides[0].className = "on";
</script>
